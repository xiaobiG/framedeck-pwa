        function normalizeRenameInput(input, oldName) {
            let name = input.trim();
            if (!name) return '';
            if (!name.includes('.')) {
                const dot = oldName.lastIndexOf('.');
                if (dot > 0) name += oldName.slice(dot);
            }
            return name;
        }

        function validateRenameTarget(name) {
            if (!name) return '文件名不能为空';
            if (/[\\/:*?"<>|]/.test(name)) return '文件名不能包含 / \\ : * ? " < > |';
            if (name === '.' || name === '..') return '文件名无效';
            return null;
        }

        function replaceRelativePathFileName(relativePath, newName) {
            const parts = relativePath.split('/');
            parts[parts.length - 1] = newName;
            return parts.join('/');
        }

        function captureCurrentPlaybackState(index) {
            if (index !== currentIndex || !mediaElement) return null;
            const isTimedMedia = mediaElement.tagName === 'VIDEO' || mediaElement.tagName === 'AUDIO';
            return {
                isTimedMedia,
                currentTime: isTimedMedia ? mediaElement.currentTime : 0,
                wasPlaying: isTimedMedia ? !mediaElement.paused : false,
                playbackRate: isTimedMedia ? mediaElement.playbackRate : parseFloat(document.getElementById('speedControl').value),
                muted: isTimedMedia ? mediaElement.muted : isMuted,
            };
        }

        function restoreCurrentPlaybackState(state) {
            if (!state || !state.isTimedMedia || !mediaElement) return;
            const restore = () => {
                if (Number.isFinite(mediaElement.duration)) {
                    mediaElement.currentTime = Math.min(state.currentTime, Math.max(0, mediaElement.duration - 0.05));
                }
                mediaElement.playbackRate = state.playbackRate;
                mediaElement.muted = state.muted;
                isMuted = state.muted;
                isPlaying = state.wasPlaying;
                if (state.wasPlaying) {
                    mediaElement.play().catch((err) => console.warn('重命名后恢复播放失败', err));
                } else {
                    mediaElement.pause();
                }
                updateControls();
            };

            if (mediaElement.readyState >= 1) {
                restore();
            } else {
                mediaElement.addEventListener('loadedmetadata', restore, { once: true });
            }
        }

        async function renamePlaylistEntry(index, rawName) {
            const entry = playlist[index];
            if (!entry || !entry.fileHandle || !entry.parentDirHandle || !entry.relativePath) {
                showToast('文件信息不完整，无法重命名', { error: true });
                return false;
            }

            const oldName = entry.name;
            const newName = normalizeRenameInput(rawName, oldName);
            const validationError = validateRenameTarget(newName);
            if (validationError) {
                showToast(validationError, { error: true });
                return false;
            }
            if (newName === oldName) return true;

            if (!(await verifyPermission(entry.parentDirHandle, true))) {
                showToast('没有目录写入权限，无法重命名', { error: true });
                return false;
            }

            try {
                try {
                    await entry.parentDirHandle.getFileHandle(newName, { create: false });
                    showToast('同目录已有同名文件', { error: true, detail: newName });
                    return false;
                } catch (err) {
                    if (err.name !== 'NotFoundError') throw err;
                }

                const playbackState = captureCurrentPlaybackState(index);
                const sourceFile = await entry.fileHandle.getFile();
                const newHandle = await entry.parentDirHandle.getFileHandle(newName, { create: true });
                const writable = await newHandle.createWritable();
                await writable.write(sourceFile);
                await writable.close();

                try {
                    await entry.parentDirHandle.removeEntry(oldName);
                } catch (err) {
                    try { await entry.parentDirHandle.removeEntry(newName); } catch (_) { /* ignore cleanup failure */ }
                    throw err;
                }

                const newFile = await newHandle.getFile();
                const oldUrl = entry.url;
                const newUrl = URL.createObjectURL(newFile);

                entry.name = newName;
                entry.url = newUrl;
                entry.type = newFile.type || entry.type;
                entry.fileHandle = newHandle;
                entry.relativePath = replaceRelativePathFileName(entry.relativePath, newName);

                if (oldUrl) URL.revokeObjectURL(oldUrl);

                if (index === currentIndex) {
                    document.getElementById('currentMedia').textContent = newName;
                    renderMediaElement(entry);
                    restoreCurrentPlaybackState(playbackState);
                }
                renderPlaylist();
                showToast(`已重命名 · ${newName}`, { detail: oldName });
                return true;
            } catch (err) {
                console.error('重命名失败', err);
                showToast(`重命名失败: ${err.message}`, { error: true });
                return false;
            }
        }

        function beginInlineRename(index, hostEl) {
            const entry = playlist[index];
            if (!entry || !hostEl || hostEl.querySelector('.rename-input')) return;

            const originalText = hostEl.textContent;
            const input = document.createElement('input');
            input.className = 'rename-input';
            input.type = 'text';
            input.value = entry.name;
            input.spellcheck = false;
            input.setAttribute('aria-label', '重命名文件');

            hostEl.textContent = '';
            hostEl.appendChild(input);

            const dot = entry.name.lastIndexOf('.');
            const selectionEnd = dot > 0 ? dot : entry.name.length;
            input.focus();
            input.setSelectionRange(0, selectionEnd);

            let finished = false;
            const cancel = () => {
                if (finished) return;
                finished = true;
                hostEl.textContent = originalText;
            };
            const commit = async () => {
                if (finished) return;
                const nextName = input.value;
                const validationError = validateRenameTarget(normalizeRenameInput(nextName, entry.name));
                if (validationError) {
                    showToast(validationError, { error: true });
                    input.focus();
                    input.select();
                    return;
                }
                finished = true;
                input.disabled = true;
                const renamed = await renamePlaylistEntry(index, nextName);
                if (playlist[index]) {
                    hostEl.textContent = playlist[index].name;
                }
            };

            input.addEventListener('click', (event) => event.stopPropagation());
            input.addEventListener('dblclick', (event) => event.stopPropagation());
            input.addEventListener('keydown', (event) => {
                event.stopPropagation();
                if (event.key === 'Enter') {
                    event.preventDefault();
                    commit();
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    cancel();
                }
            });
            input.addEventListener('blur', () => {
                commit();
            });
        }

        function renderPlaylist() {
            const list = document.getElementById('playlist');
            const count = document.getElementById('playlistCount');
            const empty = document.getElementById('playlistEmpty');
            list.innerHTML = '';
            if (count) count.textContent = String(playlist.length);
            if (empty) empty.hidden = playlist.length > 0;
            playlist.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                li.textContent = file.name;
                li.onclick = () => {
                    if (playlistClickTimer) clearTimeout(playlistClickTimer);
                    playlistClickTimer = setTimeout(() => {
                        playMedia(index);
                        playlistClickTimer = null;
                    }, 180);
                };
                li.ondblclick = (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (playlistClickTimer) {
                        clearTimeout(playlistClickTimer);
                        playlistClickTimer = null;
                    }
                    beginInlineRename(index, li);
                };
                list.appendChild(li);
            });

            if (playlist.length > 0 && currentIndex === -1) {
                playMedia(0);
            }
        }

        function updateControls() {
            document.getElementById('playPauseBtn').textContent =
                isPlaying ? '暂停' : '播放';
        }

        // 添加播放速度控制功能
        document.getElementById('speedControl').onchange = (e) => {
            if (!mediaElement || (mediaElement.tagName !== 'VIDEO' && mediaElement.tagName !== 'AUDIO')) return;
            mediaElement.playbackRate = parseFloat(e.target.value);
        };

        function attachClipMediaDiagnostics(file, element) {
            const traceId = createClipDiagnosticId('media');
            const fileExtension = file.name.includes('.')
                ? file.name.split('.').pop().toLowerCase()
                : '';
            const baseDetail = {
                sourceName: file.name,
                sourceRelativePath: file.relativePath || null,
                declaredMimeType: file.type || '(empty)',
                extension: fileExtension || '(none)',
                elementTag: element.tagName,
            };
            element.dataset.clipMediaTraceId = traceId;
            clipLog('info', 'media.attach', baseDetail, traceId);

            const logMediaState = (stage, level = 'info') => {
                clipLog(level, stage, {
                    ...baseDetail,
                    currentTime: element.currentTime,
                    duration: element.duration,
                    readyState: element.readyState,
                    networkState: element.networkState,
                    videoWidth: element.videoWidth || null,
                    videoHeight: element.videoHeight || null,
                    mediaError: element.error ? {
                        code: element.error.code,
                        message: element.error.message || null,
                    } : null,
                }, traceId);
            };

            element.addEventListener('loadstart', () => logMediaState('media.loadstart'), { once: true });
            element.addEventListener('loadedmetadata', () => logMediaState('media.loadedmetadata'), { once: true });
            element.addEventListener('canplay', () => logMediaState('media.canplay'), { once: true });
            element.addEventListener('error', () => logMediaState('media.error', 'error'), { once: true });
            element.addEventListener('abort', () => logMediaState('media.abort', 'warn'), { once: true });
            element.addEventListener('stalled', () => logMediaState('media.stalled', 'warn'));
        }

        // 在renderMediaElement函数中添加保持播放速度的代码
        function renderMediaElement(file) {
            const container = document.getElementById('mediaArea');
            // 保存控制层HTML
            const controlOverlay = document.getElementById('controlOverlay').outerHTML;
            container.innerHTML = '';
            const type = file.type;

            // 保存当前播放速度设置
            const currentSpeed = document.getElementById('speedControl').value;

            if (type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = file.url;
                mediaElement = img;
                container.appendChild(img);
            } else {
                const isAudio = file.type.startsWith('audio');
                const isVideo = file.type.startsWith('video');

                // 如果是视频文件且开启了音频图谱模式，则创建audio元素而不是video元素
                if (isVideo && trackAudioSpectrum) {
                    mediaElement = document.createElement('audio');
                    mediaElement.src = file.url;
                    mediaElement.controls = false;
                    mediaElement.autoplay = true;
                    mediaElement.playbackRate = parseFloat(currentSpeed);
                    mediaElement.muted = isMuted;

                    // 隐藏audio元素，只显示可视化效果
                    mediaElement.style.display = 'none';
                    container.appendChild(mediaElement);

                    // 为视频文件创建音频可视化效果
                    createVisualizer(mediaElement, container);
                } else {
                    // 正常处理音频和视频文件
                    mediaElement = document.createElement(isAudio ? 'audio' : 'video');
                    mediaElement.src = file.url;
                    mediaElement.controls = false;
                    mediaElement.autoplay = true;
                    mediaElement.playbackRate = parseFloat(currentSpeed);
                    mediaElement.muted = isMuted;
                    container.appendChild(mediaElement);

                    // 只有音频文件才显示可视化效果
                    if (isAudio) {
                        createVisualizer(mediaElement, container);
                    }
                }

                attachClipMediaDiagnostics(file, mediaElement);
                mediaElement.onended = () => {
                    if (playMode === 'single') {
                        mediaElement.play();
                    } else {
                        getNextIndex();
                        playMedia(currentIndex);
                    }
                };
                mediaElement.addEventListener('timeupdate', updateClipTimeline);
                mediaElement.addEventListener('loadedmetadata', updateClipDockUI);
                mediaElement.addEventListener('durationchange', updateClipDockUI);
            }

            // 重新添加控制层，确保在最上层
            container.insertAdjacentHTML('beforeend', controlOverlay);
            // 重新初始化控制层事件
            initControlOverlayEvents();
            updateClipDockUI();
        }

        function playMedia(index) {
            if (index >= 0 && index < playlist.length) {
                currentIndex = index;
                const file = playlist[index];
                clipLog('info', 'media.select', {
                    playlistIndex: index,
                    playlistSize: playlist.length,
                    sourceName: file.name,
                    sourceRelativePath: file.relativePath || null,
                    declaredMimeType: file.type || '(empty)',
                });
                document.getElementById('currentMedia').textContent = file.name;
                renderMediaElement(file);
                isPlaying = true;
                updateControls();
                renderPlaylist();
                resetClipPoints();
            }
        }

        function getNextIndex() {
            if (playMode === 'list' || playMode === 'single') {
                currentIndex = (currentIndex + 1) % playlist.length;
            } else if (playMode === 'random') {
                currentIndex = Math.floor(Math.random() * playlist.length);
            }
        }

        function getPrevIndex() {
            if (playMode === 'list' || playMode === 'single') {
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            } else if (playMode === 'random') {
                currentIndex = Math.floor(Math.random() * playlist.length);
            }
        }

        async function addToSavedDirs(name, handle) {
            const saved = await idbKeyval.get('mediaDirs') || [];
            if (!saved.includes(name)) {
                saved.push(name);
                await idbKeyval.set('mediaDirs', saved);
            }
            await idbKeyval.set(name, handle);
            renderDirList(saved);
        }

        async function removeFromSavedDirs(name) {
            // 从mediaDirs数组中移除
            const saved = await idbKeyval.get('mediaDirs') || [];
            const index = saved.indexOf(name);
            if (index > -1) {
                saved.splice(index, 1);
                await idbKeyval.set('mediaDirs', saved);
            }

            // 删除IndexedDB中该目录的句柄数据
            try {
                const db = await idbKeyval.openDB();
                const transaction = db.transaction([idbKeyval.storeName], 'readwrite');
                const store = transaction.objectStore(idbKeyval.storeName);
                await new Promise((resolve, reject) => {
                    const request = store.delete(name);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            } catch (error) {
                console.error('删除目录数据失败:', error);
            }

            // 如果删除的是当前使用的目录，清空播放列表
            if (dirHandle && dirHandle.name === name) {
                dirHandle = null;
                playlist = [];
                currentIndex = -1;
                renderPlaylist();
                if (mediaElement) {
                    const container = document.getElementById('mediaArea');
                    container.innerHTML = '';
                    mediaElement = null;
                    document.getElementById('currentMedia').textContent = '请选择媒体';
                }
            }

            // 如果删除的是lastUsedDir，清空它
            const lastUsed = await idbKeyval.get('lastUsedDir');
            if (lastUsed === name) {
                try {
                    const db = await idbKeyval.openDB();
                    const transaction = db.transaction([idbKeyval.storeName], 'readwrite');
                    const store = transaction.objectStore(idbKeyval.storeName);
                    await new Promise((resolve, reject) => {
                        const request = store.delete('lastUsedDir');
                        request.onerror = () => reject(request.error);
                        request.onsuccess = () => resolve();

        // 文件复制功能
        const PARTIAL_HASH_BYTES = 256 * 1024;

        const MD5_K = new Int32Array([
            0xd76aa478, 0xe8c7b756, 0x242070db, 0xc1bdceee, 0xf57c0faf, 0x4787c62a, 0xa8304613, 0xfd469501,
            0x698098d8, 0x8b44f7af, 0xffff5bb1, 0x895cd7be, 0x6b901122, 0xfd987193, 0xa679438e, 0x49b40821,
            0xf61e2562, 0xc040b340, 0x265e5a51, 0xe9b6c7aa, 0xd62f105d, 0x02441453, 0xd8a1e681, 0xe7d3fbc8,
            0x21e1cde6, 0xc33707d6, 0xf4d50d87, 0x455a14ed, 0xa9e3e905, 0xfcefa3f8, 0x676f02d9, 0x8d2a4c8a,
            0xfffa3942, 0x8771f681, 0x6d9d6122, 0xfde5380c, 0xa4beea44, 0x4bdecfa9, 0xf6bb4b60, 0xbebfbc70,
            0x289b7ec6, 0xeaa127fa, 0xd4ef3085, 0x04881d05, 0xd9d4d039, 0xe6db99e5, 0x1fa27cf8, 0xc4ac5665,
            0xf4292244, 0x432aff97, 0xab9423a7, 0xfc93a039, 0x655b59c3, 0x8f0ccc92, 0xffeff47d, 0x85845dd1,
            0x6fa87e4f, 0xfe2ce6e0, 0xa3014314, 0x4e0811a1, 0xf7537e82, 0xbd3af235, 0x2ad7d2bb, 0xeb86d391
        ]);
        const MD5_S = [
            7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
            5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
            4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
            6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
        ];

        function md5Rol(n, s) {
            return (n << s) | (n >>> (32 - s));
        }

        function md5Hex(arrayBuffer) {
            const data = new Uint8Array(arrayBuffer);
            const bitLen = data.length * 8;
            const padLen = (((data.length + 8 >> 6) + 1) << 6);
            const padded = new Uint8Array(padLen);
            padded.set(data);
            padded[data.length] = 0x80;
            const dv = new DataView(padded.buffer);
            dv.setUint32(padLen - 8, bitLen, true);
            dv.setUint32(padLen - 4, Math.floor(bitLen / 0x100000000), true);

            let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
            const block = new Int32Array(16);
            const bdv = new DataView(padded.buffer);

            for (let offset = 0; offset < padLen; offset += 64) {
                for (let i = 0; i < 16; i++) {
                    block[i] = bdv.getInt32(offset + i * 4, true);
                }
                let a = a0, b = b0, c = c0, d = d0;
                for (let i = 0; i < 64; i++) {
                    let f, g;
                    if (i < 16) {
                        f = (b & c) | (~b & d);
                        g = i;
                    } else if (i < 32) {
                        f = (d & b) | (~d & c);
                        g = (5 * i + 1) % 16;
                    } else if (i < 48) {
                        f = b ^ c ^ d;
                        g = (3 * i + 5) % 16;
                    } else {
                        f = c ^ (b | ~d);
                        g = (7 * i) % 16;
                    }
                    f = (a + f + MD5_K[i] + block[g]) | 0;
                    a = d;
                    d = c;
                    c = b;
                    b = (b + md5Rol(f, MD5_S[i])) | 0;
                }
                a0 = (a0 + a) | 0;
                b0 = (b0 + b) | 0;
                c0 = (c0 + c) | 0;
                d0 = (d0 + d) | 0;
            }

            const out = new DataView(new ArrayBuffer(16));
            out.setInt32(0, a0, true);
            out.setInt32(4, b0, true);
            out.setInt32(8, c0, true);
            out.setInt32(12, d0, true);
            let hex = '';
            for (let i = 0; i < 16; i++) {
                hex += out.getUint8(i).toString(16).padStart(2, '0');
            }
            return hex;
        }

        async function partialFileMd5(file) {
            const sampleSize = Math.min(file.size, PARTIAL_HASH_BYTES);
            const buf = await file.slice(0, sampleSize).arrayBuffer();
            return md5Hex(buf);
        }

        async function filesLikelySame(sourceFile, targetFile) {
            if (sourceFile.size !== targetFile.size) return false;
            const [a, b] = await Promise.all([
                partialFileMd5(sourceFile),
                partialFileMd5(targetFile),
            ]);
            return a === b;
        }

        function buildTimestampFileName(fileName) {
            const dot = fileName.lastIndexOf('.');
            const base = dot > 0 ? fileName.slice(0, dot) : fileName;
            const ext = dot > 0 ? fileName.slice(dot) : '';
            const pad = (n) => String(n).padStart(2, '0');
            const d = new Date();
            const ts = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            return `${base}-${ts}${ext}`;
        }

        function appendNumericSuffix(fileName, n) {
            const dot = fileName.lastIndexOf('.');
            if (dot > 0) return `${fileName.slice(0, dot)}-${n}${fileName.slice(dot)}`;
            return `${fileName}-${n}`;
        }

        async function findAvailableFileName(currentDir, baseName) {
            let candidate = buildTimestampFileName(baseName);
            let n = 2;
            while (true) {
                try {
                    await currentDir.getFileHandle(candidate, { create: false });
                    candidate = appendNumericSuffix(buildTimestampFileName(baseName), n++);
                } catch (e) {
                    if (e.name === 'NotFoundError') return candidate;
                    throw e;
                }
            }
        }

        async function writeFileToDir(dir, fileName, sourceFile) {
            const handle = await dir.getFileHandle(fileName, { create: true });
            const writable = await handle.createWritable();
            await writable.write(sourceFile);
            await writable.close();
        }

        async function resolveCopyTargetName(currentDir, fileName, sourceFile) {
            let existing;
            try {
                existing = await currentDir.getFileHandle(fileName, { create: false });
            } catch (e) {
                if (e.name === 'NotFoundError') return { action: 'copy', fileName };
                throw e;
            }
            const targetFile = await existing.getFile();
            if (await filesLikelySame(sourceFile, targetFile)) {
                return { action: 'skip', fileName };
            }
            const uniqueName = await findAvailableFileName(currentDir, fileName);
            return { action: 'copy', fileName: uniqueName };
        }

        async function copyEntryToTargetDir(entry) {
            if (!entry.fileHandle || !entry.relativePath) {
                console.error('文件信息不完整，无法复制');
                showToast('文件信息不完整，无法复制', { error: true });
                return false;
            }

            if (dirHandle && !(await verifyPermission(dirHandle, false))) {
                console.warn('媒体目录读权限不足，请重新选择媒体目录');
                showToast('请重新选择媒体目录', { error: true });
                return false;
            }

            try {
                const targetDirHandle = await ensureTargetDir();
                if (!targetDirHandle) return false;

                const pathParts = entry.relativePath.split('/');
                const fileName = pathParts[pathParts.length - 1];
                const dirParts = pathParts.slice(0, -1);

                let currentDir = targetDirHandle;
                for (const dirName of dirParts) {
                    try {
                        currentDir = await currentDir.getDirectoryHandle(dirName, { create: true });
                    } catch (err) {
                        console.error('创建目录失败', err);
                        showToast(`创建目录失败: ${dirName}`, { error: true });
                        return false;
                    }
                }

                const sourceFile = await entry.fileHandle.getFile();
                const resolved = await resolveCopyTargetName(currentDir, fileName, sourceFile);

                if (resolved.action === 'skip') {
                    console.log(`已存在相同文件，跳过: ${entry.relativePath}`);
                    showToast(`已存在相同文件 · ${resolved.fileName}`, { detail: entry.relativePath });
                    return 'skipped';
                }

                await writeFileToDir(currentDir, resolved.fileName, sourceFile);

                const detail = resolved.fileName === fileName
                    ? entry.relativePath
                    : `${entry.relativePath}（原同名：${fileName}）`;
                console.log(`文件已成功复制: ${resolved.fileName}`);
                showToast(`已复制 · ${resolved.fileName}`, { detail });
                return true;
            } catch (err) {
                console.error('复制文件失败', err);
                if (err.name === 'NotAllowedError') {
                    console.error('权限不足，请重新选择目标目录');
                    await clearTargetDirCache();
                    showToast('权限不足，请重新选择目标目录', { error: true });
                } else {
                    showToast(`复制失败: ${err.message}`, { error: true });
                }
                return false;
            }
        }

        function initControlOverlayEvents() {
            const controlLeft = document.getElementById('controlLeft');
            const controlRight = document.getElementById('controlRight');
            const controlCenterLeft = document.getElementById('controlCenterLeft');
            const controlCenterRight = document.getElementById('controlCenterRight');
            const progressFill = document.getElementById('progressFill');
            const progressFillFine = document.getElementById('progressFillFine');

            if (!controlLeft || !controlRight || !controlCenterLeft || !controlCenterRight) return;

            // 左侧点击 - 上一个
            controlLeft.onclick = () => {
                getPrevIndex();
                playMedia(currentIndex);
            };

            // 右侧点击 - 下一个
            controlRight.onclick = () => {
                getNextIndex();
                playMedia(currentIndex);
            };

            // 右侧右键 - 暂停/播放
            controlRight.oncontextmenu = (e) => {
                e.preventDefault();
                if (mediaElement && (mediaElement.tagName === 'VIDEO' || mediaElement.tagName === 'AUDIO')) {
                    if (mediaElement.paused) {
                        mediaElement.play();
                        isPlaying = true;
                    } else {
                        mediaElement.pause();
                        isPlaying = false;
                    }
                    updateControls();
                }
            };

            // 左侧中间区域 - 整体进度控制
            function updateGlobalProgress(e) {
                if (!mediaElement || (mediaElement.tagName !== 'VIDEO' && mediaElement.tagName !== 'AUDIO')) return;
                if (!mediaElement.duration) return;

                const rect = controlCenterLeft.getBoundingClientRect();
                const y = e.clientY - rect.top;
                const progress = 1 - (y / rect.height); // 从下到上
                const clampedProgress = Math.max(0, Math.min(1, progress));

                mediaElement.currentTime = clampedProgress * mediaElement.duration;
            }

            // 右侧中间区域 - 快进快退控制
            function updateFastSeek(e) {
                if (!mediaElement || (mediaElement.tagName !== 'VIDEO' && mediaElement.tagName !== 'AUDIO')) return;
                if (!mediaElement.duration) return;

                const rect = controlCenterRight.getBoundingClientRect();
                const centerY = rect.top + rect.height / 2; // 中间位置
                const clickY = e.clientY;
                const distanceFromCenter = centerY - clickY; // 从中间到点击位置的距离
                const maxDistance = rect.height / 2; // 中间位置到顶部/底部的距离

                // 计算快进/快退的时间（0-2秒）
                const seekTime = Math.abs(distanceFromCenter / maxDistance) * 2; // 最大2秒
                const clampedSeekTime = Math.min(2, seekTime);

                let newTime;
                if (clickY < centerY) {
                    // 上半部分 - 快进
                    newTime = mediaElement.currentTime + clampedSeekTime;
                } else {
                    // 下半部分 - 快退
                    newTime = mediaElement.currentTime - clampedSeekTime;
                }

                // 确保时间在有效范围内
                mediaElement.currentTime = Math.max(0, Math.min(mediaElement.duration, newTime));
            }

            let dragMode = null; // 'global' 或 'fine'

            controlCenterLeft.onmousedown = (e) => {
                e.preventDefault();
                if (e.button === 0) {
                    isDragging = true;
                    dragMode = 'global';
                    updateGlobalProgress(e);
                }
            };

            controlCenterRight.onmousedown = (e) => {
                e.preventDefault();
                if (e.button === 0) {
                    updateFastSeek(e);
                }
            };

            document.onmousemove = (e) => {
                if (isDragging && dragMode === 'global') {
                    updateGlobalProgress(e);
                }
            };

            document.onmouseup = () => {
                isDragging = false;
                dragMode = null;
            };

            // 右键截图功能
            controlCenterLeft.oncontextmenu = (e) => {
                e.preventDefault();
                takeScreenshot();
            };

            controlCenterRight.oncontextmenu = (e) => {
                e.preventDefault();
                takeScreenshot();
            };
        }

        init();
        initTheme();
        initToolbarMenu();
        initControlOverlay();
        initClipDock();
        initMobileShell();
        initPwa();
        initFullscreen();
        document.getElementById('emptyDirPicker').onclick = () => {
            document.getElementById('dirPicker').click();
        };

        // 添加键盘事件监听器
        document.addEventListener('keydown', (event) => {
            const target = event.target;
            const isEditing = target instanceof HTMLElement
                && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));

            if (event.code === 'KeyG'
                && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey
                && !event.repeat && !isEditing) {
                event.preventDefault();
                enqueueQuickClipExport();
                return;
            }

            if (event.code === 'KeyF'
                && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey
                && !event.repeat && !isEditing) {
                event.preventDefault();
                toggleFullscreen();
                return;
            }

            if (event.code === 'F3') {
                event.preventDefault();
                applyMediaFocusMode(!mediaFocusMode);
                return;
            }

            if (event.code === 'F4') {
                event.preventDefault();
                copyToTargetDir();
                return;
            }

            if (event.code === 'F5') {
                event.preventDefault();
                enqueueClipExport();
                return;
            }

            if (event.code === 'BracketLeft') {
                event.preventDefault();
                markClipPoint('a');
                return;
            }

            if (event.code === 'BracketRight') {
                event.preventDefault();
                markClipPoint('b');
                return;
            }

            if (event.code === 'KeyL' && !event.ctrlKey && !event.metaKey && !event.altKey) {
                event.preventDefault();
                toggleAbLoop();
                return;
            }

            if (event.code === 'KeyT' && !event.ctrlKey && !event.metaKey && !event.altKey) {
                event.preventDefault();
                toggleClipTasksPanel();
                return;
            }

            if (event.code === 'Space') {
                event.preventDefault();
                copyCurrentAndPreviewNext();
                return;
            }

            // 防止方向键滚动页面
            if ([32, 37, 38, 39, 40].includes(event.keyCode)) {
                event.preventDefault();
            }

            // 确保有媒体元素和播放列表
            if (!mediaElement || playlist.length === 0) return;

            switch (event.keyCode) {
                case 38: // 方向键上 - 切换上一个
                    getPrevIndex();
                    playMedia(currentIndex);
                    break;

                case 40: // 方向键下 - 切换下一个
                    getNextIndex();
                    playMedia(currentIndex);
                    break;

                case 37: // 方向键左 - 跳转到当前进度之前的随机位置
                    if (mediaElement.duration && (mediaElement.tagName === 'VIDEO' || mediaElement.tagName === 'AUDIO')) {
                        const currentTime = mediaElement.currentTime;
                        const randomTime = Math.random() * currentTime;
                        mediaElement.currentTime = randomTime;
                    }
                    break;

                case 39: // 方向键右 - 跳转到当前进度之后的随机位置
                    if (mediaElement.duration && (mediaElement.tagName === 'VIDEO' || mediaElement.tagName === 'AUDIO')) {
                        const currentTime = mediaElement.currentTime;
                        const duration = mediaElement.duration;
                        const randomTime = currentTime + Math.random() * (duration - currentTime);
                        mediaElement.currentTime = randomTime;
                    }
                    break;
            }
        });


        function createVisualizer(audioElement, container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audioElement);
            const analyser = audioCtx.createAnalyser();
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const stars = Array.from({ length: 150 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                dx: (Math.random() - 0.5) * 0.3,
                dy: (Math.random() - 0.5) * 0.3,
            }));

            function drawStars() {
                for (let s of stars) {
                    s.x += s.dx;
                    s.y += s.dy;
                    if (s.x < 0 || s.x > canvas.width) s.dx *= -1;
                    if (s.y < 0 || s.y > canvas.height) s.dy *= -1;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fill();
                }
            }

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawStars();

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(canvas.width, canvas.height) / 5;
                const bars = 100;
                const step = Math.PI * 2 / bars;

                for (let i = 0; i < bars; i++) {
                    const angle = i * step;
                    const barHeight = dataArray[i % bufferLength] * 1.5;
                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                    const y2 = centerY + Math.sin(angle) * (radius + barHeight);

                    const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
                    gradient.addColorStop(0, 'rgba(0,255,255,0.7)');
                    gradient.addColorStop(1, 'rgba(255,0,255,0.8)');

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                // 中心脉动环
                const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius + avg / 5, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            audioElement.addEventListener('play', () => {
                audioCtx.resume();
                draw();
            });
        }
    </script>
