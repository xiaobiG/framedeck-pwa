    <script>
        // 原生IndexedDB工具函数，替代idbKeyval
        const idbKeyval = {
            dbName: 'MediaPlayerDB',
            storeName: 'keyval',

            async openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName);
                        }
                    };
                });
            },

            async get(key) {
                const db = await this.openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([this.storeName], 'readonly');
                    const store = transaction.objectStore(this.storeName);
                    const request = store.get(key);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                });
            },

            async set(key, value) {
                const db = await this.openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([this.storeName], 'readwrite');
                    const store = transaction.objectStore(this.storeName);
                    const request = store.put(value, key);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            }
        };

        const modeCycle = { list: 'single', single: 'random', random: 'list' };

        let playlist = [];
        let currentIndex = -1;
        let isPlaying = false;
        let playMode = 'single';
        let mediaElement = null;
        let dirHandle = null;
        // 添加全局静音状态变量
        let isMuted = true;
        let trackAudioSpectrum = false; // 音频图谱开关状态，默认关闭
        let sidebarVisible = true;
        let mediaFocusMode = false;
        let playlistClickTimer = null;

        // --- Clip Dock (v20) ---
        let clipPointA = null;
        let clipPointB = null;
        let activeClipPoint = null;
        let abLoopEnabled = false;
        let clipTasksPanelOpen = false;
        let clipTasks = [];
        let clipTaskIdSeq = 0;
        let clipQueueProcessing = false;
        let ffmpegInstance = null;
        let ffmpegLoadPromise = null;
        let activeClipProgressJobId = null;
        let activeClipFfmpegJobId = null;
        let clipDockHidden = false;
        let clipDockPosition = null;
        const clipDiagnosticLogs = [];
        const clipDiagnosticSessionId = createClipDiagnosticId('session');
        const VENDOR_FFMPEG = './vendor/ffmpeg/';
        const MIN_CLIP_DURATION = 0.1;
        const CLIP_FINE_WINDOW_SECONDS = 240;
        const CLIP_DOCK_POSITION_KEY = 'clipDockPosition';
        const CLIP_DOCK_HIDDEN_KEY = 'clipDockHidden';
        const UI_THEME_KEY = 'uiTheme';
        const QUICK_CLIP_BEFORE_SECONDS = 2;
        const QUICK_CLIP_AFTER_SECONDS = 3;
        const CLIP_DIAGNOSTIC_LOG_LIMIT = 1500;
        const CLIP_FFMPEG_LOG_LIMIT_PER_JOB = 250;

        function createClipDiagnosticId(prefix = 'trace') {
            const randomPart = typeof crypto !== 'undefined' && crypto.randomUUID
                ? crypto.randomUUID().slice(0, 8)
                : Math.random().toString(36).slice(2, 10);
            return `${prefix}-${Date.now().toString(36)}-${randomPart}`;
        }

        function serializeClipError(error) {
            if (!error) return null;
            return {
                name: error.name || 'Error',
                message: error.message || String(error),
                stack: error.stack || null,
                cause: error.cause ? String(error.cause) : null,
            };
        }

        function getClipRuntimeSnapshot() {
            return {
                pageUrl: location.href,
                secureContext: window.isSecureContext,
                crossOriginIsolated: window.crossOriginIsolated,
                userAgent: navigator.userAgent,
                online: navigator.onLine,
                ffmpegApi: typeof FFmpegWASM !== 'undefined',
                ffmpegUtil: typeof FFmpegUtil !== 'undefined',
            };
        }

        function clipLog(level, stage, detail = {}, traceId = null) {
            const record = {
                timestamp: new Date().toISOString(),
                elapsedMs: Math.round(performance.now()),
                sessionId: clipDiagnosticSessionId,
                traceId,
                level,
                stage,
                detail,
            };
            clipDiagnosticLogs.push(record);
            if (clipDiagnosticLogs.length > CLIP_DIAGNOSTIC_LOG_LIMIT) {
                clipDiagnosticLogs.splice(0, clipDiagnosticLogs.length - CLIP_DIAGNOSTIC_LOG_LIMIT);
            }
            const method = level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log';
            console[method](`[clip:${stage}]${traceId ? ` [${traceId}]` : ''}`, detail);
            return record;
        }

        function getClipDiagnosticPayload() {
            return {
                schemaVersion: 1,
                exportedAt: new Date().toISOString(),
                sessionId: clipDiagnosticSessionId,
                runtime: getClipRuntimeSnapshot(),
                jobs: clipTasks.map((job) => ({
                    id: job.id,
                    traceId: job.traceId,
                    type: job.type,
                    sourceName: job.sourceName,
                    sourceRelativePath: job.sourceEntry?.relativePath || null,
                    range: { start: job.a, end: job.b, duration: job.b - job.a },
                    transcode: job.transcode,
                    status: job.status,
                    failureStage: job.failureStage || null,
                    error: job.errorDetail || null,
                    outputName: job.outputName,
                    progress: job.progress,
                })),
                logs: [...clipDiagnosticLogs],
            };
        }

        function formatClipDiagnosticPayload() {
            return JSON.stringify(getClipDiagnosticPayload(), null, 2);
        }

        async function copyClipDiagnosticLogs() {
            const text = formatClipDiagnosticPayload();
            try {
                await navigator.clipboard.writeText(text);
                showToast('剪辑诊断日志已复制', { detail: clipDiagnosticSessionId });
                clipLog('info', 'diagnostics.copy.success', { bytes: new Blob([text]).size });
            } catch (error) {
                clipLog('error', 'diagnostics.copy.failed', { error: serializeClipError(error) });
                showToast('复制失败，请改用“下载日志”', { error: true, detail: error.message });
            }
        }

        function downloadClipDiagnosticLogs() {
            const text = formatClipDiagnosticPayload();
            const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `video-v20-clip-log-${clipDiagnosticSessionId}.json`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            clipLog('info', 'diagnostics.download', { fileName: link.download, bytes: blob.size });
            showToast('剪辑诊断日志已下载', { detail: link.download });
        }

        window.getClipDiagnosticLogs = getClipDiagnosticPayload;
        clipLog('info', 'diagnostics.session.start', getClipRuntimeSnapshot());

        function isClipableMedia() {
            if (!mediaElement) return false;
            if (mediaElement.tagName === 'VIDEO') return true;
            if (mediaElement.tagName === 'AUDIO') return true;
            return false;
        }

        function getCurrentMediaDiagnosticSnapshot() {
            const entry = playlist[currentIndex];
            if (!mediaElement) {
                return {
                    present: false,
                    playlistIndex: currentIndex,
                    playlistSize: playlist.length,
                };
            }
            return {
                present: true,
                tagName: mediaElement.tagName,
                sourceName: entry?.name || null,
                sourceRelativePath: entry?.relativePath || null,
                declaredMimeType: entry?.type || '(empty)',
                extension: entry?.name?.includes('.')
                    ? entry.name.split('.').pop().toLowerCase()
                    : '(none)',
                mediaTraceId: mediaElement.dataset?.clipMediaTraceId || null,
                currentSrcProtocol: (() => {
                    try { return new URL(mediaElement.currentSrc || mediaElement.src).protocol; }
                    catch (_) { return null; }
                })(),
                currentTime: mediaElement.currentTime,
                duration: mediaElement.duration,
                readyState: mediaElement.readyState,
                networkState: mediaElement.networkState,
                paused: mediaElement.paused,
                ended: mediaElement.ended,
                error: mediaElement.error ? {
                    code: mediaElement.error.code,
                    message: mediaElement.error.message || null,
                } : null,
                videoWidth: mediaElement.videoWidth || null,
                videoHeight: mediaElement.videoHeight || null,
                playlistIndex: currentIndex,
                playlistSize: playlist.length,
            };
        }

        function formatClipTime(seconds) {
            if (seconds == null || !Number.isFinite(seconds)) return '--:--';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const secInt = Math.floor(secs);
            const ms = Math.floor((secs - secInt) * 1000);
            return `${String(mins).padStart(2, '0')}:${String(secInt).padStart(2, '0')}.${String(ms).padStart(3, '0')}`;
        }

        function formatClipRange(a, b) {
            return `${formatClipTime(a)} → ${formatClipTime(b)}`;
        }

        function percentOfDuration(value, duration) {
            if (!duration || !Number.isFinite(duration) || value == null || !Number.isFinite(value)) return null;
            return Math.max(0, Math.min(100, (value / duration) * 100));
        }

        function getClipPoint(which) {
            if (which === 'a') return clipPointA;
            if (which === 'b') return clipPointB;
            return null;
        }

        function setActiveClipPoint(which) {
            activeClipPoint = which === 'a' || which === 'b' ? which : null;
            updateClipDockUI();
        }

        function setClipPoint(which, seconds) {
            if (!Number.isFinite(seconds)) return;
            const duration = mediaElement && Number.isFinite(mediaElement.duration) ? mediaElement.duration : null;
            const clamped = duration == null ? Math.max(0, seconds) : Math.max(0, Math.min(duration, seconds));
            if (which === 'a') {
                clipPointA = clamped;
            } else if (which === 'b') {
                clipPointB = clamped;
            } else {
                return;
            }
            activeClipPoint = which;
        }

        function isFineTimelineVisible(duration) {
            return Number.isFinite(duration)
                && duration > CLIP_FINE_WINDOW_SECONDS
                && activeClipPoint != null
                && getClipPoint(activeClipPoint) != null;
        }

        function pointToFinePercent(value, anchor, duration) {
            if (
                value == null || anchor == null
                || !Number.isFinite(value) || !Number.isFinite(anchor)
                || !Number.isFinite(duration) || duration <= CLIP_FINE_WINDOW_SECONDS
            ) {
                return null;
            }
            const windowStart = anchor - (CLIP_FINE_WINDOW_SECONDS / 2);
            const pct = ((value - windowStart) / CLIP_FINE_WINDOW_SECONDS) * 100;
            if (pct < 0 || pct > 100) return null;
            return Math.max(0, Math.min(100, pct));
        }

        function finePercentToPoint(pct, anchor, duration) {
            if (
                pct == null || anchor == null
                || !Number.isFinite(pct) || !Number.isFinite(anchor)
                || !Number.isFinite(duration) || duration <= CLIP_FINE_WINDOW_SECONDS
            ) {
                return null;
            }
            const target = anchor + ((pct - 0.5) * CLIP_FINE_WINDOW_SECONDS);
            if (target < 0 || target > duration) return null;
            return target;
        }

        function updateClipTimeline() {
            const progressEl = document.getElementById('clipTimelineProgress');
            const selectionEl = document.getElementById('clipTimelineSelection');
            const markerA = document.getElementById('clipTimelineMarkerA');
            const markerB = document.getElementById('clipTimelineMarkerB');
            const fineEl = document.getElementById('clipTimelineFine');
            const fineSelectionEl = document.getElementById('clipTimelineFineSelection');
            const fineDisabledLeft = document.getElementById('clipTimelineFineDisabledLeft');
            const fineDisabledRight = document.getElementById('clipTimelineFineDisabledRight');
            const fineMarkerA = document.getElementById('clipTimelineFineMarkerA');
            const fineMarkerB = document.getElementById('clipTimelineFineMarkerB');
            const currentEl = document.getElementById('clipTimelineCurrent');
            const totalEl = document.getElementById('clipTimelineTotal');
            const rangeEl = document.getElementById('clipTimelineRange');
            if (!progressEl || !selectionEl || !markerA || !markerB || !currentEl || !totalEl || !rangeEl) return;

            const hasMedia = isClipableMedia() && mediaElement && Number.isFinite(mediaElement.duration);
            const duration = hasMedia ? mediaElement.duration : 0;
            const current = hasMedia ? mediaElement.currentTime : null;
            const progress = percentOfDuration(current, duration);
            progressEl.style.width = progress == null ? '0%' : `${progress}%`;
            currentEl.textContent = formatClipTime(current);
            totalEl.textContent = hasMedia ? formatClipTime(duration) : '--:--';

            const aPct = percentOfDuration(clipPointA, duration);
            const bPct = percentOfDuration(clipPointB, duration);
            markerA.style.opacity = aPct == null ? '0' : '1';
            markerB.style.opacity = bPct == null ? '0' : '1';
            markerA.classList.toggle('clip-timeline-marker--visible', aPct != null);
            markerB.classList.toggle('clip-timeline-marker--visible', bPct != null);
            markerA.classList.toggle('clip-timeline-marker--editing', activeClipPoint === 'a');
            markerB.classList.toggle('clip-timeline-marker--editing', activeClipPoint === 'b');
            if (aPct != null) markerA.style.left = `${aPct}%`;
            if (bPct != null) markerB.style.left = `${bPct}%`;

            if (aPct != null && bPct != null && clipPointB > clipPointA) {
                selectionEl.style.left = `${aPct}%`;
                selectionEl.style.width = `${Math.max(0, bPct - aPct)}%`;
                rangeEl.textContent = formatClipRange(clipPointA, clipPointB);
            } else {
                selectionEl.style.left = '0';
                selectionEl.style.width = '0';
                rangeEl.textContent = hasMedia && aPct != null && bPct != null
                    ? '请调整 A/B 顺序'
                    : (hasMedia ? '标记 A/B 以创建剪辑区间' : '未加载可剪辑媒体');
            }

            const showFine = hasMedia && isFineTimelineVisible(duration);
            if (fineEl) fineEl.hidden = !showFine;
            if (!showFine) {
                if (fineSelectionEl) {
                    fineSelectionEl.style.left = '0';
                    fineSelectionEl.style.width = '0';
                }
                if (fineDisabledLeft) fineDisabledLeft.style.width = '0';
                if (fineDisabledRight) fineDisabledRight.style.width = '0';
                if (fineMarkerA) {
                    fineMarkerA.style.opacity = '0';
                    fineMarkerA.classList.remove('clip-timeline-marker--visible', 'clip-timeline-marker--editing');
                }
                if (fineMarkerB) {
                    fineMarkerB.style.opacity = '0';
                    fineMarkerB.classList.remove('clip-timeline-marker--visible', 'clip-timeline-marker--editing');
                }
                return;
            }

            const anchor = getClipPoint(activeClipPoint);
            const otherPoint = activeClipPoint === 'a' ? clipPointB : clipPointA;
            const halfWindow = CLIP_FINE_WINDOW_SECONDS / 2;
            const disabledLeftPct = Math.max(0, (halfWindow - anchor) / CLIP_FINE_WINDOW_SECONDS) * 100;
            const disabledRightPct = Math.max(0, (anchor + halfWindow - duration) / CLIP_FINE_WINDOW_SECONDS) * 100;
            if (fineDisabledLeft) fineDisabledLeft.style.width = `${Math.min(50, disabledLeftPct)}%`;
            if (fineDisabledRight) fineDisabledRight.style.width = `${Math.min(50, disabledRightPct)}%`;

            const fineAPct = activeClipPoint === 'a' ? 50 : pointToFinePercent(clipPointA, anchor, duration);
            const fineBPct = activeClipPoint === 'b' ? 50 : pointToFinePercent(clipPointB, anchor, duration);
            if (fineMarkerA) {
                fineMarkerA.style.opacity = fineAPct == null ? '0' : '1';
                fineMarkerA.classList.toggle('clip-timeline-marker--visible', fineAPct != null);
                fineMarkerA.classList.toggle('clip-timeline-marker--editing', activeClipPoint === 'a');
                if (fineAPct != null) fineMarkerA.style.left = `${fineAPct}%`;
            }
            if (fineMarkerB) {
                fineMarkerB.style.opacity = fineBPct == null ? '0' : '1';
                fineMarkerB.classList.toggle('clip-timeline-marker--visible', fineBPct != null);
                fineMarkerB.classList.toggle('clip-timeline-marker--editing', activeClipPoint === 'b');
                if (fineBPct != null) fineMarkerB.style.left = `${fineBPct}%`;
            }
            if (fineSelectionEl) {
                const activePct = 50;
                const otherPct = activeClipPoint === 'a' ? fineBPct : fineAPct;
                const hasValidRange = clipPointA != null && clipPointB != null && clipPointB > clipPointA && otherPoint != null;
                if (hasValidRange && otherPct != null) {
                    const left = Math.min(activePct, otherPct);
                    const right = Math.max(activePct, otherPct);
                    fineSelectionEl.style.left = `${left}%`;
                    fineSelectionEl.style.width = `${right - left}%`;
                } else {
                    fineSelectionEl.style.left = '0';
                    fineSelectionEl.style.width = '0';
                }
            }
        }

        function updateClipDockUI() {
            const btnA = document.getElementById('clipMarkA');
            const btnB = document.getElementById('clipMarkB');
            const durationEl = document.getElementById('clipDuration');
            const loopBtn = document.getElementById('clipLoopBtn');
            const clearBtn = document.getElementById('clipClearBtn');
            const exportBtn = document.getElementById('clipExportBtn');
            const clipable = isClipableMedia();

            if (btnA) {
                btnA.textContent = clipPointA != null ? `起点 ${formatClipTime(clipPointA)}` : '设起点';
                btnA.classList.toggle('clip-dock-btn--active', clipPointA != null);
                btnA.classList.toggle('clip-dock-btn--editing', activeClipPoint === 'a');
                btnA.disabled = !clipable;
            }
            if (btnB) {
                btnB.textContent = clipPointB != null ? `终点 ${formatClipTime(clipPointB)}` : '设终点';
                btnB.classList.toggle('clip-dock-btn--active', clipPointB != null);
                btnB.classList.toggle('clip-dock-btn--editing', activeClipPoint === 'b');
                btnB.disabled = !clipable;
            }
            if (durationEl) {
                if (clipPointA != null && clipPointB != null && clipPointB > clipPointA) {
                    durationEl.textContent = formatClipTime(clipPointB - clipPointA);
                } else {
                    durationEl.textContent = '--:--';
                }
            }
            if (loopBtn) {
                loopBtn.classList.toggle('clip-dock-btn--active', abLoopEnabled);
                loopBtn.disabled = !clipable || clipPointA == null || clipPointB == null || clipPointB <= clipPointA;
            }
            if (clearBtn) {
                clearBtn.disabled = !clipable || (clipPointA == null && clipPointB == null && !abLoopEnabled);
            }
            if (exportBtn) {
                exportBtn.disabled = !clipable || clipPointA == null || clipPointB == null
                    || clipPointB <= clipPointA
                    || (clipPointB - clipPointA) < MIN_CLIP_DURATION;
            }
            updateClipTimeline();
            updateClipTasksBadge();
        }

        function resetClipPoints() {
            clipPointA = null;
            clipPointB = null;
            activeClipPoint = null;
            setAbLoopEnabled(false);
            updateClipDockUI();
        }

        function clearClipPoints() {
            resetClipPoints();
        }

        function markClipPoint(which) {
            if (!isClipableMedia() || !mediaElement.duration) {
                showToast('当前媒体无法标记剪辑点', { error: true });
                return;
            }
            setClipPoint(which, mediaElement.currentTime);
            updateClipDockUI();
        }

        function onTimeUpdateForAbLoop() {
            if (!abLoopEnabled || clipPointA == null || clipPointB == null) return;
            if (mediaElement.currentTime >= clipPointB - 0.05) {
                mediaElement.currentTime = clipPointA;
            }
        }

        function setAbLoopEnabled(enabled) {
            abLoopEnabled = enabled;
            if (!mediaElement || !isClipableMedia()) {
                abLoopEnabled = false;
                updateClipDockUI();
                return;
            }
            mediaElement.removeEventListener('timeupdate', onTimeUpdateForAbLoop);
            if (abLoopEnabled) {
                mediaElement.addEventListener('timeupdate', onTimeUpdateForAbLoop);
            }
            updateClipDockUI();
        }

        function toggleAbLoop() {
            if (clipPointA == null || clipPointB == null || clipPointB <= clipPointA) {
                showToast('请先设置有效的 A/B 点', { error: true });
                return;
            }
            setAbLoopEnabled(!abLoopEnabled);
        }

        function toggleClipTasksPanel() {
            clipTasksPanelOpen = !clipTasksPanelOpen;
            const panel = document.getElementById('clipTasksPanel');
            const toggle = document.getElementById('clipTasksToggle');
            if (panel) panel.hidden = !clipTasksPanelOpen;
            if (toggle) toggle.textContent = clipTasksPanelOpen ? '▼' : '▲';
            if (clipDockPosition) {
                requestAnimationFrame(() => applyClipDockPosition(clipDockPosition, { persist: true }));
            }
        }

        function clampClipDockPosition(pos) {
            const dock = document.getElementById('clipDock');
            if (!dock || !pos) return null;
            const rect = dock.getBoundingClientRect();
            const margin = 8;
            const width = rect.width || 160;
            const height = rect.height || 48;
            return {
                left: Math.min(Math.max(pos.left, margin), Math.max(margin, window.innerWidth - width - margin)),
                top: Math.min(Math.max(pos.top, margin), Math.max(margin, window.innerHeight - height - margin)),
            };
        }

        function applyClipDockPosition(pos, { persist = false } = {}) {
            const dock = document.getElementById('clipDock');
            if (!dock || !pos) return;
            const clamped = clampClipDockPosition(pos);
            if (!clamped) return;
            clipDockPosition = clamped;
            dock.style.left = `${clamped.left}px`;
            dock.style.top = `${clamped.top}px`;
            dock.style.bottom = 'auto';
            dock.style.transform = 'none';
            if (persist) {
                idbKeyval.set(CLIP_DOCK_POSITION_KEY, clamped).catch((err) => {
                    console.warn('保存剪辑条位置失败', err);
                });
            }
        }

        function applyClipDockHidden(hidden, { persist = false } = {}) {
            const dock = document.getElementById('clipDock');
            if (!dock) return;
            clipDockHidden = hidden;
            dock.classList.toggle('clip-dock--hidden', hidden);
            const handle = document.getElementById('clipDockHandle');
            if (handle) {
                handle.title = hidden ? '双击展开剪辑条，按住拖动' : '拖动剪辑条，双击收起';
            }
            if (persist) {
                idbKeyval.set(CLIP_DOCK_HIDDEN_KEY, hidden).catch((err) => {
                    console.warn('保存剪辑条显示状态失败', err);
                });
            }
        }

        function initClipDockDrag() {
            const dock = document.getElementById('clipDock');
            const handle = document.getElementById('clipDockHandle');
            if (!dock || !handle) return;

            let dragState = null;
            handle.addEventListener('pointerdown', (event) => {
                event.preventDefault();
                const rect = dock.getBoundingClientRect();
                dragState = {
                    offsetX: event.clientX - rect.left,
                    offsetY: event.clientY - rect.top,
                };
                dock.classList.add('clip-dock--dragging');
                handle.setPointerCapture(event.pointerId);
            });

            handle.addEventListener('pointermove', (event) => {
                if (!dragState) return;
                applyClipDockPosition({
                    left: event.clientX - dragState.offsetX,
                    top: event.clientY - dragState.offsetY,
                });
            });

            const finishDrag = (event) => {
                if (!dragState) return;
                dragState = null;
                dock.classList.remove('clip-dock--dragging');
                try { handle.releasePointerCapture(event.pointerId); } catch (_) { /* ignore */ }
                if (clipDockPosition) {
                    idbKeyval.set(CLIP_DOCK_POSITION_KEY, clipDockPosition).catch((err) => {
                        console.warn('保存剪辑条位置失败', err);
                    });
                }
            };

            handle.addEventListener('pointerup', finishDrag);
            handle.addEventListener('pointercancel', finishDrag);
            handle.addEventListener('dblclick', (event) => {
                event.preventDefault();
                applyClipDockHidden(!clipDockHidden, { persist: true });
            });
        }

        function initClipTimelineSeek() {
            const timeline = document.getElementById('clipTimeline');
            if (!timeline) return;

            function pctFromEvent(track, event) {
                const rect = track.getBoundingClientRect();
                if (!rect.width) return null;
                return Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
            }

            function timeFromEvent(track, event) {
                if (!isClipableMedia() || !Number.isFinite(mediaElement.duration)) return null;
                const pct = pctFromEvent(track, event);
                return pct == null ? null : pct * mediaElement.duration;
            }

            const fullTrack = timeline.querySelector('[data-clip-timeline-track="full"]');
            const fineTrack = timeline.querySelector('[data-clip-timeline-track="fine"]');

            if (fullTrack) {
                fullTrack.addEventListener('click', (event) => {
                    if (event.target.closest('.clip-timeline-marker')) return;
                    const target = timeFromEvent(fullTrack, event);
                    if (target == null) return;
                    mediaElement.currentTime = target;
                    updateClipTimeline();
                });
            }

            if (fineTrack) {
                fineTrack.addEventListener('click', (event) => {
                    if (event.target.closest('.clip-timeline-marker')) return;
                    if (!isClipableMedia() || !Number.isFinite(mediaElement.duration)) return;
                    const anchor = getClipPoint(activeClipPoint);
                    if (!isFineTimelineVisible(mediaElement.duration) || anchor == null) return;
                    const pct = pctFromEvent(fineTrack, event);
                    if (pct == null) return;
                    const target = finePercentToPoint(pct, anchor, mediaElement.duration);
                    if (target == null) return;
                    setClipPoint(activeClipPoint, target);
                    updateClipDockUI();
                });
            }

            const markerPairs = [
                { el: document.getElementById('clipTimelineMarkerA'), which: 'a' },
                { el: document.getElementById('clipTimelineMarkerB'), which: 'b' },
            ];
            const fineMarkerPairs = [
                { el: document.getElementById('clipTimelineFineMarkerA'), which: 'a' },
                { el: document.getElementById('clipTimelineFineMarkerB'), which: 'b' },
            ];

            for (const { el, which } of fineMarkerPairs) {
                if (!el) continue;
                el.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (getClipPoint(which) != null) setActiveClipPoint(which);
                });
            }

            for (const { el, which } of markerPairs) {
                if (!el || !fullTrack) continue;
                let dragging = false;
                el.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (!dragging && getClipPoint(which) != null) setActiveClipPoint(which);
                });
                el.addEventListener('pointerdown', (event) => {
                    if (!isClipableMedia() || getClipPoint(which) == null) return;
                    event.preventDefault();
                    event.stopPropagation();
                    dragging = false;
                    setActiveClipPoint(which);
                    el.classList.add('clip-timeline-marker--dragging');
                    try { el.setPointerCapture(event.pointerId); } catch (_) { /* ignore */ }
                });
                el.addEventListener('pointermove', (event) => {
                    if (!el.classList.contains('clip-timeline-marker--dragging')) return;
                    const target = timeFromEvent(fullTrack, event);
                    if (target == null) return;
                    dragging = true;
                    setClipPoint(which, target);
                    updateClipDockUI();
                });
                const endDrag = (event) => {
                    if (!el.classList.contains('clip-timeline-marker--dragging')) return;
                    el.classList.remove('clip-timeline-marker--dragging');
                    try { el.releasePointerCapture(event.pointerId); } catch (_) { /* ignore */ }
                    requestAnimationFrame(() => { dragging = false; });
                };
                el.addEventListener('pointerup', endDrag);
                el.addEventListener('pointercancel', endDrag);
            }
        }

        function clipTaskStatusLabel(status) {
            const labels = {
                pending: '等待中',
                'loading-ffmpeg': '加载 ffmpeg…',
                running: '处理中',
                done: '完成',
                error: '失败',
            };
            return labels[status] || status;
        }

        function updateClipTasksBadge() {
            const badge = document.getElementById('clipTasksBadge');
            if (!badge) return;
            const active = clipTasks.filter((t) =>
                t.status === 'pending' || t.status === 'loading-ffmpeg' || t.status === 'running'
            ).length;
            if (active > 0) {
                badge.hidden = false;
                badge.textContent = String(active);
            } else {
                badge.hidden = true;
            }
        }

        function renderClipTasksList() {
            const list = document.getElementById('clipTasksList');
            if (!list) return;
            list.innerHTML = '';
            if (clipTasks.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'clip-dock-empty';
                empty.textContent = '暂无导出任务';
                list.appendChild(empty);
                updateClipTasksBadge();
                return;
            }
            for (const job of [...clipTasks].reverse()) {
                const li = document.createElement('li');
                li.className = `clip-task-item clip-task-item--${job.status}`;
                const title = document.createElement('div');
                title.className = 'clip-task-title';
                title.textContent = job.outputName || job.sourceName;
                title.title = job.sourceName;
                const meta = document.createElement('div');
                meta.className = 'clip-task-meta';
                let metaText = `${formatClipRange(job.a, job.b)} · ${clipTaskStatusLabel(job.status)}`;
                if (job.status === 'done' && job.outputName) {
                    metaText = `${formatClipRange(job.a, job.b)} · ✓ ${job.outputName} · ${job.traceId}`;
                } else if (job.status === 'error' && job.errorMsg) {
                    metaText = `${formatClipRange(job.a, job.b)} · ${job.errorMsg} · ${job.traceId}`;
                } else if (job.status === 'running' && job.progress > 0) {
                    metaText += ` · ${Math.round(job.progress * 100)}%`;
                } else {
                    metaText += ` · ${job.traceId}`;
                }
                meta.textContent = metaText;
                li.appendChild(title);
                li.appendChild(meta);
                if (job.status === 'pending' || job.status === 'loading-ffmpeg'
                    || job.status === 'running') {
                    const progWrap = document.createElement('div');
                    progWrap.className = 'clip-task-progress';
                    const progBar = document.createElement('div');
                    progBar.className = 'clip-task-progress-bar';
                    if (job.progress > 0 && job.status === 'running') {
                        progBar.style.width = `${Math.round(job.progress * 100)}%`;
                    } else {
                        progBar.classList.add('clip-task-progress-bar--indeterminate');
                        progBar.style.width = '40%';
                    }
                    progWrap.appendChild(progBar);
                    li.appendChild(progWrap);
                }
                list.appendChild(li);
            }
            updateClipTasksBadge();
        }

        function buildClipOutputName(sourceName, a, b, label = 'clip') {
            const dot = sourceName.lastIndexOf('.');
            const base = dot > 0 ? sourceName.slice(0, dot) : sourceName;
            const pad = (n) => String(n).padStart(2, '0');
            const d = new Date();
            const ts = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            const aStr = a.toFixed(3).replace('.', 'p');
            const bStr = b.toFixed(3).replace('.', 'p');
            return `${base}-${label}-${aStr}-${bStr}-${ts}.mp4`;
        }

        async function getFfmpeg(traceId = null) {
            if (ffmpegInstance) {
                clipLog('info', 'ffmpeg.reuse', {}, traceId);
                return ffmpegInstance;
            }
            if (ffmpegLoadPromise) {
                clipLog('info', 'ffmpeg.load.await-existing', {}, traceId);
                return ffmpegLoadPromise;
            }

            ffmpegLoadPromise = (async () => {
                const loadStartedAt = performance.now();
                clipLog('info', 'ffmpeg.load.start', {
                    corePath: `${VENDOR_FFMPEG}ffmpeg-core.js`,
                    wasmPath: `${VENDOR_FFMPEG}ffmpeg-core.wasm`,
                }, traceId);
                const { FFmpeg } = FFmpegWASM;
                const { toBlobURL } = FFmpegUtil;
                const ffmpeg = new FFmpeg();
                ffmpeg.on('progress', ({ progress }) => {
                    if (activeClipProgressJobId == null) return;
                    const job = clipTasks.find((j) => j.id === activeClipProgressJobId);
                    if (job && progress > 0) {
                        job.progress = progress;
                        renderClipTasksList();
                    }
                });
                ffmpeg.on('log', ({ message }) => {
                    const job = clipTasks.find((item) => item.id === activeClipFfmpegJobId);
                    if (job) {
                        job.ffmpegLogCount = (job.ffmpegLogCount || 0) + 1;
                        if (job.ffmpegLogCount <= CLIP_FFMPEG_LOG_LIMIT_PER_JOB) {
                            clipLog('info', 'ffmpeg.output', { message }, job.traceId);
                        } else if (job.ffmpegLogCount === CLIP_FFMPEG_LOG_LIMIT_PER_JOB + 1) {
                            clipLog('warn', 'ffmpeg.output.truncated', {
                                retainedLines: CLIP_FFMPEG_LOG_LIMIT_PER_JOB,
                            }, job.traceId);
                        }
                    } else {
                        clipLog('info', 'ffmpeg.output', { message }, traceId);
                    }
                });
                const coreBlobStartedAt = performance.now();
                const coreURL = await toBlobURL(`${VENDOR_FFMPEG}ffmpeg-core.js`, 'text/javascript');
                clipLog('info', 'ffmpeg.asset.core.ready', {
                    durationMs: Math.round(performance.now() - coreBlobStartedAt),
                }, traceId);
                const wasmBlobStartedAt = performance.now();
                const wasmURL = await toBlobURL(`${VENDOR_FFMPEG}ffmpeg-core.wasm`, 'application/wasm');
                clipLog('info', 'ffmpeg.asset.wasm.ready', {
                    durationMs: Math.round(performance.now() - wasmBlobStartedAt),
                }, traceId);
                await ffmpeg.load({
                    coreURL,
                    wasmURL,
                });
                ffmpegInstance = ffmpeg;
                clipLog('info', 'ffmpeg.load.success', {
                    durationMs: Math.round(performance.now() - loadStartedAt),
                }, traceId);
                return ffmpeg;
            })();

            try {
                return await ffmpegLoadPromise;
            } catch (err) {
                clipLog('error', 'ffmpeg.load.failed', { error: serializeClipError(err) }, traceId);
                ffmpegLoadPromise = null;
                throw err;
            }
        }

        async function runClipExportJob(job) {
            const jobStartedAt = performance.now();
            let stage = 'job.start';
            let ffmpeg = null;
            let targetDirHandle = null;
            const inputName = `in-${job.id}`;
            const outputName = `out-${job.id}.mp4`;
            const ss = job.a.toFixed(3);
            const t = (job.b - job.a).toFixed(3);
            let inputFile = null;
            let writable = null;

            clipLog('info', stage, {
                jobId: job.id,
                type: job.type,
                sourceName: job.sourceName,
                sourceRelativePath: job.sourceEntry.relativePath,
                range: { start: job.a, end: job.b, duration: job.b - job.a },
                transcode: job.transcode,
                media: job.mediaSnapshot,
            }, job.traceId);

            try {
                stage = 'ffmpeg.load';
                job.status = 'loading-ffmpeg';
                renderClipTasksList();
                ffmpeg = await getFfmpeg(job.traceId);

                stage = 'target.resolve';
                clipLog('info', `${stage}.start`, {}, job.traceId);
                targetDirHandle = await ensureTargetDir({ promptIfMissing: true });
                if (!targetDirHandle) {
                    const noTargetError = new Error('未选择目标目录');
                    noTargetError.code = 'TARGET_DIRECTORY_MISSING';
                    throw noTargetError;
                }
                let targetPermission = 'unknown';
                if (typeof targetDirHandle.queryPermission === 'function') {
                    try {
                        targetPermission = await targetDirHandle.queryPermission({ mode: 'readwrite' });
                    } catch (_) { /* browser may not implement queryPermission */ }
                }
                clipLog('info', `${stage}.success`, {
                    directoryName: targetDirHandle.name,
                    permission: targetPermission,
                }, job.traceId);

                stage = 'source.read';
                job.status = 'running';
                job.progress = 0;
                activeClipProgressJobId = job.id;
                renderClipTasksList();

                const sourceFile = await job.sourceEntry.fileHandle.getFile();
                const ext = sourceFile.name.includes('.') ? sourceFile.name.split('.').pop() : 'mp4';
                inputFile = `${inputName}.${ext}`;
                clipLog('info', `${stage}.success`, {
                    fileName: sourceFile.name,
                    extension: ext.toLowerCase(),
                    mimeType: sourceFile.type || '(empty)',
                    sizeBytes: sourceFile.size,
                    lastModified: sourceFile.lastModified
                        ? new Date(sourceFile.lastModified).toISOString()
                        : null,
                }, job.traceId);

                stage = 'ffmpeg.input.write';
                const sourceBytes = await FFmpegUtil.fetchFile(sourceFile);
                await ffmpeg.writeFile(inputFile, sourceBytes);
                clipLog('info', `${stage}.success`, {
                    virtualFile: inputFile,
                    bytes: sourceBytes.byteLength,
                }, job.traceId);
                const ffmpegArgs = job.transcode
                    ? [
                        '-ss', ss,
                        '-t', t,
                        '-i', inputFile,
                        '-map', '0:v:0',
                        '-map', '0:a?',
                        '-c:v', 'libx264',
                        '-preset', 'veryfast',
                        '-crf', '23',
                        '-pix_fmt', 'yuv420p',
                        '-c:a', 'aac',
                        '-b:a', '128k',
                        '-movflags', '+faststart',
                        '-avoid_negative_ts', '1',
                        outputName,
                    ]
                    : [
                        '-ss', ss,
                        '-t', t,
                        '-i', inputFile,
                        '-c', 'copy',
                        '-avoid_negative_ts', '1',
                        outputName,
                    ];

                stage = 'ffmpeg.exec';
                clipLog('info', `${stage}.start`, {
                    args: ffmpegArgs,
                    strategy: job.transcode ? 'h264-aac-transcode' : 'stream-copy',
                }, job.traceId);
                activeClipFfmpegJobId = job.id;
                const execStartedAt = performance.now();
                let exitCode;
                try {
                    exitCode = await ffmpeg.exec(ffmpegArgs);
                } finally {
                    activeClipFfmpegJobId = null;
                }
                clipLog(exitCode === 0 ? 'info' : 'error', `${stage}.complete`, {
                    exitCode,
                    durationMs: Math.round(performance.now() - execStartedAt),
                    ffmpegLogLines: job.ffmpegLogCount || 0,
                }, job.traceId);
                if (Number.isFinite(exitCode) && exitCode !== 0) {
                    const execError = new Error(`ffmpeg 退出码 ${exitCode}`);
                    execError.code = 'FFMPEG_NON_ZERO_EXIT';
                    throw execError;
                }

                stage = 'ffmpeg.output.read';
                const data = await ffmpeg.readFile(outputName);
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                clipLog('info', `${stage}.success`, {
                    virtualFile: outputName,
                    bytes: blob.size,
                    mimeType: blob.type,
                }, job.traceId);

                stage = 'target.path.prepare';
                const pathParts = job.sourceEntry.relativePath.split('/');
                const dirParts = pathParts.slice(0, -1);
                let currentDir = targetDirHandle;
                for (const dirName of dirParts) {
                    currentDir = await currentDir.getDirectoryHandle(dirName, { create: true });
                }
                clipLog('info', `${stage}.success`, { relativeDirectories: dirParts }, job.traceId);

                stage = 'target.file.write';
                const outFileName = await findAvailableFileName(currentDir, job.plannedOutputName);
                const handle = await currentDir.getFileHandle(outFileName, { create: true });
                writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                writable = null;
                clipLog('info', `${stage}.success`, {
                    outputName: outFileName,
                    bytes: blob.size,
                }, job.traceId);

                job.status = 'done';
                job.outputName = outFileName;
                job.progress = 1;
                showToast(`剪辑已保存 · ${outFileName}`, { detail: job.sourceName });
                clipLog('info', 'job.success', {
                    outputName: outFileName,
                    durationMs: Math.round(performance.now() - jobStartedAt),
                }, job.traceId);
            } catch (err) {
                if (writable) {
                    try { await writable.abort(); } catch (_) { /* ignore */ }
                    writable = null;
                }
                job.failureStage = stage;
                job.errorDetail = serializeClipError(err);
                job.status = 'error';
                job.errorMsg = `${stage}: ${err.message || '导出失败'}`;
                clipLog('error', 'job.failed', {
                    failureStage: stage,
                    durationMs: Math.round(performance.now() - jobStartedAt),
                    error: job.errorDetail,
                }, job.traceId);
                showToast(`剪辑失败（${stage}）`, {
                    error: true,
                    duration: 5000,
                    detail: `${err.message || '导出失败'} · ${job.traceId}`,
                });
            } finally {
                activeClipFfmpegJobId = null;
                activeClipProgressJobId = null;
                if (ffmpeg && inputFile) {
                    try {
                        await ffmpeg.deleteFile(inputFile);
                        clipLog('info', 'cleanup.input.success', { virtualFile: inputFile }, job.traceId);
                    } catch (error) {
                        clipLog('warn', 'cleanup.input.failed', {
                            virtualFile: inputFile,
                            error: serializeClipError(error),
                        }, job.traceId);
                    }
                }
                if (ffmpeg) {
                    try {
                        await ffmpeg.deleteFile(outputName);
                        clipLog('info', 'cleanup.output.success', { virtualFile: outputName }, job.traceId);
                    } catch (error) {
                        clipLog('warn', 'cleanup.output.failed', {
                            virtualFile: outputName,
                            error: serializeClipError(error),
                        }, job.traceId);
                    }
                }
                renderClipTasksList();
            }
        }

        async function processClipQueue() {
            if (clipQueueProcessing) {
                clipLog('info', 'queue.wakeup.skipped', {
                    pending: clipTasks.filter((job) => job.status === 'pending').length,
                });
                return;
            }
            clipQueueProcessing = true;
            clipLog('info', 'queue.processing.start', {
                pending: clipTasks.filter((job) => job.status === 'pending').length,
            });
            try {
                while (true) {
                    const job = clipTasks.find((j) => j.status === 'pending');
                    if (!job) break;
                    await runClipExportJob(job);
                }
            } catch (error) {
                clipLog('error', 'queue.processing.failed', { error: serializeClipError(error) });
                throw error;
            } finally {
                clipQueueProcessing = false;
                clipLog('info', 'queue.processing.stop', {
                    pending: clipTasks.filter((job) => job.status === 'pending').length,
                    failed: clipTasks.filter((job) => job.status === 'error').length,
                });
            }
        }

        function validateClipRange(a, b, duration) {
            if (a == null || b == null) return '请先设置 A/B 点';
            if (b <= a) return 'B 点必须晚于 A 点';
            if (b - a < MIN_CLIP_DURATION) return '片段过短';
            if (duration && (a < 0 || b > duration)) return '剪辑点超出视频时长';
            return null;
        }

        function enqueueClipJob({
            a,
            b,
            label = 'clip',
            transcode = false,
            toastText = '已加入导出队列',
            traceId = createClipDiagnosticId('clip'),
        }) {
            const entry = playlist[currentIndex];
            if (!entry || !entry.fileHandle || !entry.relativePath) {
                clipLog('error', 'enqueue.rejected', {
                    reason: 'SOURCE_ENTRY_INCOMPLETE',
                    media: getCurrentMediaDiagnosticSnapshot(),
                }, traceId);
                showToast('文件信息不完整，无法导出', { error: true });
                return false;
            }

            const sourceEntry = {
                fileHandle: entry.fileHandle,
                relativePath: entry.relativePath,
                name: entry.name,
            };
            const plannedOutputName = buildClipOutputName(entry.name, a, b, label);

            const job = {
                id: ++clipTaskIdSeq,
                traceId,
                type: label,
                sourceName: sourceEntry.name,
                sourceEntry,
                a,
                b,
                status: 'pending',
                progress: 0,
                plannedOutputName,
                outputName: null,
                errorMsg: null,
                transcode,
                mediaSnapshot: getCurrentMediaDiagnosticSnapshot(),
                failureStage: null,
                errorDetail: null,
                ffmpegLogCount: 0,
            };
            clipTasks.push(job);
            clipLog('info', 'enqueue.accepted', {
                jobId: job.id,
                type: job.type,
                queuePosition: clipTasks.filter((item) => item.status === 'pending').length,
                sourceName: job.sourceName,
                sourceRelativePath: job.sourceEntry.relativePath,
                range: { start: a, end: b, duration: b - a },
                transcode,
                plannedOutputName,
                media: job.mediaSnapshot,
            }, traceId);
            if (!clipTasksPanelOpen) {
                clipTasksPanelOpen = true;
                const panel = document.getElementById('clipTasksPanel');
                const toggle = document.getElementById('clipTasksToggle');
                if (panel) panel.hidden = false;
                if (toggle) toggle.textContent = '▼';
            }
            renderClipTasksList();
            showToast(toastText, { detail: `${sourceEntry.name} · ${formatClipRange(a, b)}` });

            processClipQueue().catch((e) => {
                clipLog('error', 'queue.wakeup.failed', { error: serializeClipError(e) }, traceId);
            });
            return true;
        }

        async function enqueueClipExport() {
            const traceId = createClipDiagnosticId('ab');
            clipLog('info', 'shortcut.ab.requested', {
                clipPointA,
                clipPointB,
                media: getCurrentMediaDiagnosticSnapshot(),
            }, traceId);
            if (!isClipableMedia()) {
                clipLog('warn', 'shortcut.ab.rejected', { reason: 'MEDIA_NOT_CLIPABLE' }, traceId);
                showToast('仅支持视频/音频剪辑', { error: true });
                return;
            }
            const duration = mediaElement.duration;
            const err = validateClipRange(clipPointA, clipPointB, duration);
            if (err) {
                clipLog('warn', 'shortcut.ab.rejected', {
                    reason: 'INVALID_RANGE',
                    message: err,
                }, traceId);
                showToast(err, { error: true });
                return;
            }

            const a = clipPointA;
            const b = clipPointB;
            if (enqueueClipJob({ a, b, traceId })) {
                resetClipPoints();
            }
        }

        function enqueueQuickClipExport() {
            const traceId = createClipDiagnosticId('quick-g');
            clipLog('info', 'shortcut.g.requested', {
                windowBeforeSeconds: QUICK_CLIP_BEFORE_SECONDS,
                windowAfterSeconds: QUICK_CLIP_AFTER_SECONDS,
                media: getCurrentMediaDiagnosticSnapshot(),
            }, traceId);
            if (!mediaElement || mediaElement.tagName !== 'VIDEO') {
                clipLog('warn', 'shortcut.g.rejected', { reason: 'VIDEO_NOT_ACTIVE' }, traceId);
                showToast('G 键快速片段仅支持视频', { error: true });
                return;
            }

            const duration = mediaElement.duration;
            const currentTime = mediaElement.currentTime;
            if (!Number.isFinite(duration) || duration <= 0 || !Number.isFinite(currentTime)) {
                clipLog('warn', 'shortcut.g.rejected', {
                    reason: 'VIDEO_NOT_READY',
                    duration,
                    currentTime,
                    readyState: mediaElement.readyState,
                    networkState: mediaElement.networkState,
                }, traceId);
                showToast('视频尚未就绪，无法保存快速片段', { error: true });
                return;
            }

            const a = Math.max(0, currentTime - QUICK_CLIP_BEFORE_SECONDS);
            const b = Math.min(duration, currentTime + QUICK_CLIP_AFTER_SECONDS);
            const err = validateClipRange(a, b, duration);
            if (err) {
                clipLog('warn', 'shortcut.g.rejected', {
                    reason: 'INVALID_RANGE',
                    message: err,
                    range: { start: a, end: b, duration: b - a },
                }, traceId);
                showToast(`无法保存快速片段：${err}`, { error: true });
                return;
            }

            enqueueClipJob({
                a,
                b,
                label: 'quick-g',
                transcode: true,
                toastText: 'G 键片段已加入导出队列',
                traceId,
            });
        }

        function getFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        function syncFullscreenUI() {
            const active = Boolean(getFullscreenElement());
            document.body.classList.toggle('is-fullscreen', active);
            const button = document.getElementById('fullscreenBtn');
            if (button) {
                button.textContent = active ? '退出全屏' : '全屏';
                button.setAttribute('aria-pressed', String(active));
                button.title = active ? '退出全屏 (F / Esc)' : '进入全屏 (F)';
            }
            window.dispatchEvent(new Event('resize'));
        }

        async function toggleFullscreen() {
            try {
                if (getFullscreenElement()) {
                    const exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (!exit) throw new Error('当前浏览器不支持退出全屏');
                    await exit.call(document);
                    return;
                }
                const root = document.documentElement;
                const request = root.requestFullscreen || root.webkitRequestFullscreen;
                if (!request) throw new Error('当前浏览器不支持全屏');
                await request.call(root);
            } catch (error) {
                console.warn('切换全屏失败', error);
                showToast(error.message || '无法切换全屏', { error: true });
            }
        }

        function initFullscreen() {
            const button = document.getElementById('fullscreenBtn');
            const enabled = Boolean(
                document.fullscreenEnabled
                || document.webkitFullscreenEnabled
                || document.documentElement.requestFullscreen
                || document.documentElement.webkitRequestFullscreen
            );
            if (button) {
                button.onclick = () => toggleFullscreen();
                if (!enabled && !document.documentElement.webkitRequestFullscreen) {
                    button.disabled = true;
                    button.title = '当前浏览器不支持全屏';
                }
            }
            document.addEventListener('fullscreenchange', syncFullscreenUI);
            document.addEventListener('webkitfullscreenchange', syncFullscreenUI);
            syncFullscreenUI();
        }

        function initMobileShell() {
            const app = document.querySelector('.app');
            const openBtn = document.getElementById('mobileSidebarBtn');
            const moreBtn = document.getElementById('mobileMoreBtn');
            const backdrop = document.getElementById('sidebarBackdrop');
            const sidebar = document.querySelector('.sidebar');
            if (!app || !openBtn || !moreBtn || !backdrop || !sidebar) return;

            const closeDrawer = () => {
                app.classList.remove('mobile-sidebar-open');
                openBtn.setAttribute('aria-expanded', 'false');
                backdrop.hidden = true;
                if (window.innerWidth <= 760) {
                    sidebar.setAttribute('aria-hidden', 'true');
                    sidebar.inert = true;
                } else {
                    sidebar.removeAttribute('aria-hidden');
                    sidebar.inert = false;
                }
            };
            const openDrawer = () => {
                app.classList.add('mobile-sidebar-open');
                openBtn.setAttribute('aria-expanded', 'true');
                backdrop.hidden = false;
                sidebar.removeAttribute('aria-hidden');
                sidebar.inert = false;
            };

            openBtn.onclick = () => app.classList.contains('mobile-sidebar-open')
                ? closeDrawer()
                : openDrawer();
            backdrop.onclick = closeDrawer;
            moreBtn.onclick = () => {
                const details = document.querySelector('.toolbar-more');
                if (details && !details.hidden) details.open = !details.open;
            };
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') closeDrawer();
            });
            window.addEventListener('resize', () => {
                if (window.innerWidth > 760) closeDrawer();
            });
            closeDrawer();
        }

        function updatePwaStatus() {
            const status = document.getElementById('pwaStatus');
            if (!status) return;
            const text = status.querySelector('span');
            const offline = !navigator.onLine;
            status.classList.toggle('is-offline', offline);
            if (text) {
                text.textContent = offline
                    ? '离线模式'
                    : (navigator.serviceWorker?.controller ? '离线可用' : '本地优先');
            }
        }

        function initPwa() {
            const installButton = document.getElementById('installAppBtn');
            let deferredInstallPrompt = null;
            const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;

            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                deferredInstallPrompt = event;
                if (installButton && !isStandalone()) installButton.hidden = false;
            });

            if (installButton) {
                installButton.onclick = async () => {
                    if (!deferredInstallPrompt) {
                        showToast('请使用浏览器菜单中的“安装应用”');
                        return;
                    }
                    deferredInstallPrompt.prompt();
                    const choice = await deferredInstallPrompt.userChoice;
                    deferredInstallPrompt = null;
                    installButton.hidden = true;
                    if (choice.outcome === 'accepted') showToast('FrameDeck 已安装');
                };
            }

            window.addEventListener('appinstalled', () => {
                deferredInstallPrompt = null;
                if (installButton) installButton.hidden = true;
                showToast('FrameDeck 已安装');
            });
            window.addEventListener('online', updatePwaStatus);
            window.addEventListener('offline', updatePwaStatus);
            navigator.serviceWorker?.addEventListener('controllerchange', updatePwaStatus);
            updatePwaStatus();

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', async () => {
                    try {
                        const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
                        updatePwaStatus();
                        registration.addEventListener('updatefound', () => {
                            const worker = registration.installing;
                            worker?.addEventListener('statechange', () => {
                                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showToast('新版本已就绪，下次打开自动更新');
                                }
                            });
                        });
                    } catch (error) {
                        console.warn('PWA 离线服务注册失败', error);
                        const status = document.getElementById('pwaStatus');
                        status?.classList.add('is-offline');
                        const text = status?.querySelector('span');
                        if (text) text.textContent = '仅在线模式';
                    }
                });
            }
        }

        function initToolbarMenu() {
            const details = document.querySelector('.toolbar-more');
            const summary = details?.querySelector('summary');
            const menu = details?.querySelector('.toolbar-menu');
            const overflowMenu = document.getElementById('toolbarOverflowMenu');
            const controls = document.querySelector('.controls');
            if (!details || !summary || !menu || !overflowMenu || !controls) return;
            document.body.appendChild(menu);

            const overflowItems = [
                { id: 'toolbarUtilityRow', anchorId: 'toolbarUtilityRowAnchor' },
                { id: 'screenshotFormatRow', anchorId: 'screenshotFormatRowAnchor' },
                { id: 'modeBtn', anchorId: 'modeBtnAnchor' },
                { id: 'speedControl', anchorId: 'speedControlAnchor' },
                { id: 'sidebarToggleBtn', anchorId: 'sidebarToggleBtnAnchor' },
                { id: 'fullscreenBtn', anchorId: 'fullscreenBtnAnchor' },
                { id: 'muteBtn', anchorId: 'muteBtnAnchor' },
                { id: 'screenshotBtn', anchorId: 'screenshotBtnAnchor' },
            ].map((item) => ({
                node: document.getElementById(item.id),
                anchor: document.getElementById(item.anchorId),
            })).filter((item) => item.node && item.anchor);

            function placeToolbarMenu() {
                if (!details.open || details.hidden) return;
                const gap = 8;
                const rect = summary.getBoundingClientRect();
                const menuRect = menu.getBoundingClientRect();
                const width = menuRect.width || 250;
                const height = menuRect.height || 120;
                const left = Math.max(12, Math.min(rect.right - width, window.innerWidth - width - 12));
                let top = rect.bottom + gap;
                if (top + height > window.innerHeight - 12) {
                    top = Math.max(12, rect.top - height - gap);
                }
                menu.style.left = `${left}px`;
                menu.style.right = 'auto';
                menu.style.top = `${top}px`;
            }

            function closeToolbarMenu() {
                details.open = false;
                menu.classList.remove('toolbar-menu--open');
                menu.classList.remove('toolbar-menu--mobile');
            }

            function moveToOverflow(item) {
                if (item.node.parentElement === overflowMenu) return;
                overflowMenu.appendChild(item.node);
            }

            function moveToToolbar(item) {
                if (item.node.parentElement !== overflowMenu) return;
                item.anchor.after(item.node);
            }

            function toolbarOverflows() {
                return controls.scrollWidth > controls.clientWidth + 1;
            }

            function updateToolbarGroupVisibility() {
                controls.querySelectorAll('.control-group:not(.control-group--media):not(.toolbar-inline-row)').forEach((group) => {
                    group.hidden = !group.querySelector('button, select');
                });
            }

            function updateToolbarOverflow() {
                if (window.innerWidth <= 760 && details.open) {
                    details.hidden = false;
                    menu.classList.add('toolbar-menu--open', 'toolbar-menu--mobile');
                    return;
                }
                for (const item of overflowItems) moveToToolbar(item);
                details.hidden = true;
                updateToolbarGroupVisibility();
                if (!toolbarOverflows()) {
                    closeToolbarMenu();
                    return;
                }
                details.hidden = false;
                for (const item of overflowItems) {
                    if (!toolbarOverflows()) break;
                    moveToOverflow(item);
                    updateToolbarGroupVisibility();
                }
                const hasOverflowItems = overflowMenu.children.length > 0;
                details.hidden = !hasOverflowItems;
                if (!hasOverflowItems) {
                    closeToolbarMenu();
                    return;
                }
                if (details.open) {
                    menu.classList.add('toolbar-menu--open');
                    requestAnimationFrame(placeToolbarMenu);
                }
            }

            document.addEventListener('click', (event) => {
                if (!details.open
                    || details.contains(event.target)
                    || menu.contains(event.target)
                    || event.target.closest?.('#mobileMoreBtn')) return;
                closeToolbarMenu();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') closeToolbarMenu();
            });
            details.addEventListener('toggle', () => {
                if (details.open) {
                    if (window.innerWidth <= 760) {
                        menu.classList.add('toolbar-menu--open', 'toolbar-menu--mobile');
                        return;
                    }
                    updateToolbarOverflow();
                    if (details.hidden || overflowMenu.children.length === 0) {
                        closeToolbarMenu();
                        return;
                    }
                    menu.classList.add('toolbar-menu--open');
                    requestAnimationFrame(placeToolbarMenu);
                } else {
                    menu.classList.remove('toolbar-menu--open');
                    menu.classList.remove('toolbar-menu--mobile');
                }
            });
            window.addEventListener('resize', () => {
                updateToolbarOverflow();
                if (details.open) requestAnimationFrame(placeToolbarMenu);
            });
            window.addEventListener('scroll', () => {
                if (details.open) requestAnimationFrame(placeToolbarMenu);
            }, true);
            if ('ResizeObserver' in window) {
                const toolbarResizeObserver = new ResizeObserver(() => {
                    requestAnimationFrame(updateToolbarOverflow);
                });
                toolbarResizeObserver.observe(controls);
            }

            updateToolbarOverflow();
        }

        const SCREENSHOT_JPEG_QUALITY = 0.92;

        function getScreenshotFormatKey() {
            const sel = document.getElementById('screenshotFormat');
            const v = sel && sel.value;
            return v === 'png' ? 'png' : 'jpeg';
        }

        function getScreenshotFormatOptions() {
            const key = getScreenshotFormatKey();
            if (key === 'jpeg') {
                return { mime: 'image/jpeg', ext: 'jpg', quality: SCREENSHOT_JPEG_QUALITY };
            }
            return { mime: 'image/png', ext: 'png' };
        }

        function canvasToImageBlob(canvas, options) {
            return new Promise((resolve, reject) => {
                const { mime, quality } = options;
                const cb = (blob) => (blob ? resolve(blob) : reject(new Error('toBlob failed')));
                if (mime === 'image/jpeg') {
                    canvas.toBlob(cb, mime, quality);
                } else {
                    canvas.toBlob(cb, mime);
                }
            });
        }

        function captureFrameToCanvas() {
            if (!mediaElement) return null;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (mediaElement.tagName === 'VIDEO') {
                canvas.width = mediaElement.videoWidth;
                canvas.height = mediaElement.videoHeight;
                if (!canvas.width || !canvas.height) return null;
                ctx.drawImage(mediaElement, 0, 0, canvas.width, canvas.height);
            } else if (mediaElement.tagName === 'IMG') {
                canvas.width = mediaElement.naturalWidth;
                canvas.height = mediaElement.naturalHeight;
                if (!canvas.width || !canvas.height) return null;
                ctx.drawImage(mediaElement, 0, 0, canvas.width, canvas.height);
            } else {
                return null;
            }
            return canvas;
        }

        function buildScreenshotFilename() {
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const currentFileName = playlist[currentIndex]?.name || 'screenshot';
            const fileNameWithoutExt = currentFileName.replace(/\.[^/.]+$/, '');
            const ext = getScreenshotFormatOptions().ext;
            return `${fileNameWithoutExt}-${timestamp}.${ext}`;
        }

        async function verifyPermission(handle, readWrite = false) {
            const opts = { mode: readWrite ? 'readwrite' : 'read' };
            if ((await handle.queryPermission(opts)) === 'granted') return true;
            try {
                if ((await handle.requestPermission(opts)) === 'granted') return true;
            } catch (e) {
                if (e.name === 'SecurityError') return false;
                throw e;
            }
            return false;
        }

        function isMediaFile(filename) {
            return /\.(mp4|webm|ogg|mp3|wav|m4a|jpg|png|gif|flac)$/i.test(filename);
        }

        async function getMediaFiles(dirHandle, relativePath = '') {
            const files = [];

            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && isMediaFile(entry.name)) {
                    const file = await entry.getFile();
                    const fileRelativePath = relativePath ? `${relativePath}/${entry.name}` : entry.name;
                    files.push({
                        name: entry.name,
                        url: URL.createObjectURL(file),
                        type: file.type,
                        fileHandle: entry,
                        parentDirHandle: dirHandle,
                        relativePath: fileRelativePath
                    });
                } else if (entry.kind === 'directory') {
                    // 递归处理子目录
                    const subRelativePath = relativePath ? `${relativePath}/${entry.name}` : entry.name;
                    const subFiles = await getMediaFiles(entry, subRelativePath);
                    files.push(...subFiles);
                }
            }

            return files;
        }

        function applySidebarVisibility(visible) {
            const app = document.querySelector('.app');
            const btn = document.getElementById('sidebarToggleBtn');
            if (!app || !btn) return;
            sidebarVisible = visible;
            if (visible) {
                app.classList.remove('sidebar-collapsed');
                btn.textContent = '隐藏目录';
            } else {
                app.classList.add('sidebar-collapsed');
                btn.textContent = '显示目录';
            }
        }

        let toastHideTimer = null;
        let toastRemoveTimer = null;

        function showToast(message, { error = false, duration = 2500, detail = '' } = {}) {
            const host = document.getElementById('toastHost');
            if (!host) return;

            if (toastHideTimer) {
                clearTimeout(toastHideTimer);
                toastHideTimer = null;
            }
            if (toastRemoveTimer) {
                clearTimeout(toastRemoveTimer);
                toastRemoveTimer = null;
            }

            host.innerHTML = '';
            const toast = document.createElement('div');
            toast.className = `toast ${error ? 'toast--error' : 'toast--success'}`;
            toast.textContent = message;
            if (detail) toast.title = detail;
            host.appendChild(toast);

            requestAnimationFrame(() => toast.classList.add('toast--visible'));

            toastHideTimer = setTimeout(() => {
                toast.classList.remove('toast--visible');
                toast.classList.add('toast--hide');
                toastRemoveTimer = setTimeout(() => {
                    toast.remove();
                    toastRemoveTimer = null;
                }, 200);
                toastHideTimer = null;
            }, duration);
        }

        async function init() {
            const savedDirs = await idbKeyval.get('mediaDirs') || [];
            const lastUsed = await idbKeyval.get('lastUsedDir');

            const targetDirHandle = await getTargetDir();
            if (targetDirHandle) {
                updateTargetDirButton(targetDirHandle.name);
            } else {
                await clearTargetDirCache();
            }

            const formatSel = document.getElementById('screenshotFormat');
            const savedScreenshotFormat = await idbKeyval.get('screenshotFormat');
            if (savedScreenshotFormat === 'jpeg' || savedScreenshotFormat === 'png') {

            formatSel.onchange = async () => {

            };
